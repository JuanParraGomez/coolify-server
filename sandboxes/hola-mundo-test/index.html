<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hola Mundo</title>
  <style>
    html,body{height:100%;}
    body{
      margin:0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(135deg, #f6d365 0%, #fda085 50%, #fbc2eb 100%);
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
      color: #fff;
    }
    .container{
      text-align:center;
      padding:4rem 2rem;
      max-width:900px;
      width:100%;
    }
    h1{
      margin:0 0 1rem 0;
      font-size:clamp(2.5rem, 8vw, 5.5rem);
      line-height:1;
      letter-spacing:-0.02em;
      color: #ffffff;
      text-shadow: 0 6px 20px rgba(0,0,0,0.18);
      font-weight:700;
    }
    p.lead{
      margin:0 auto;
      max-width:40ch;
      font-size:clamp(1rem, 2.2vw, 1.25rem);
      color: rgba(255,255,255,0.95);
      opacity:0.95;
    }
    .card{
      margin-top:2.5rem;
      display:inline-block;
      padding:0.75rem 1.25rem;
      border-radius:10px;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 30px rgba(2,6,23,0.24);
    }
    .small{font-size:0.9rem; color: rgba(255,255,255,0.9); margin:0;}
    @media (prefers-reduced-motion: no-preference){
      h1{transition: transform 400ms ease;}
      .container:hover h1{transform: translateY(-6px);} 
    }
  </style>
</head>
<body>
  <div class="container" role="main" aria-label="Landing Hola Mundo">
    <h1>Hola Mundo</h1>
    <p class="lead">Un landing simple y bonito, construido con HTML y CSS puro — título grande, subtítulo y fondo en degradado.</p>
    <div class="card" aria-hidden="true">
      <p class="small">Hecho para ser ligero, accesible y agradable a la vista.</p>
    </div>
  </div>
</body>
</html>
