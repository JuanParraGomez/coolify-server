<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Landing Simple</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f5f5f0;
        color: #161616;
      }
      main {
        max-width: 720px;
        width: 100%;
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-size: clamp(2rem, 4vw, 3rem);
        margin: 0 0 1rem;
      }
      p {
        font-size: 1.1rem;
        margin: 0 0 2rem;
        color: #4a4a4a;
      }
      .contact-button {
        display: inline-block;
        padding: 0.85rem 1.4rem;
        border-radius: 0.6rem;
        background: #161616;
        color: #ffffff;
        text-decoration: none;
        font-weight: 700;
      }
      .contact-button:hover {
        background: #2b2b2b;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Bienvenido a nuestra landing</h1>
      <p>Una solución simple para presentar tu propuesta de valor en segundos.</p>
      <a class="contact-button" href="mailto:contacto@ejemplo.com">Contacto</a>
    </main>
  </body>
</html>
