<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Landing simple</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(180deg, #f7f9fc 0%, #ecf2ff 100%);
        color: #1f2937;
      }

      main {
        width: min(680px, 92vw);
        padding: 2.5rem 2rem;
        text-align: center;
        background: #ffffff;
        border-radius: 14px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.1);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.9rem, 4vw, 2.7rem);
      }

      p {
        margin: 1rem 0 1.8rem;
        line-height: 1.6;
        color: #4b5563;
      }

      .cta {
        display: inline-block;
        padding: 0.85rem 1.4rem;
        border-radius: 10px;
        background: #2563eb;
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
        transition: background-color 0.2s ease;
      }

      .cta:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Lanza tu idea en minutos</h1>
      <p>
        Una landing clara y directa para presentar tu producto, captar la atención y convertir visitas en
        oportunidades.
      </p>
      <a class="cta" href="#">Comenzar ahora</a>
    </main>
  </body>
</html>
