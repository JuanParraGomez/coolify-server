<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Landing Simple</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f5f7fb;
        color: #111827;
      }

      main {
        width: min(92vw, 640px);
        text-align: center;
        padding: 2.5rem 1.5rem;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 4vw, 2.8rem);
      }

      p {
        margin: 0 0 1.75rem;
        font-size: 1.1rem;
        color: #4b5563;
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 0.8rem 1.4rem;
        font-size: 1rem;
        font-weight: 600;
        background: #2563eb;
        color: #ffffff;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Lanza tu idea hoy</h1>
      <p>Una landing simple para presentar tu producto en segundos.</p>
      <button type="button">Comenzar ahora</button>
    </main>
  </body>
</html>
