<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Landing Simple</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f4f7ff, #eefaf3);
        color: #1f2937;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
      }
      .hero {
        width: min(100%, 560px);
        text-align: center;
        background: #ffffff;
        border-radius: 16px;
        padding: 2.5rem 2rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(1.8rem, 4vw, 2.4rem);
      }
      p {
        margin: 0 0 1.75rem;
        color: #4b5563;
        font-size: 1.05rem;
      }
      .cta {
        display: inline-block;
        padding: 0.8rem 1.4rem;
        border-radius: 10px;
        background: #2563eb;
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
      }
      .cta:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <h1>Impulsa tu proyecto hoy</h1>
        <p>Una landing simple para presentar tu idea y convertir visitantes en clientes.</p>
        <a class="cta" href="#">Comenzar ahora</a>
      </section>
    </main>
  </body>
</html>
