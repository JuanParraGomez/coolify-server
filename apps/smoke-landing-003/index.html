<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Landing Simple</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f5f7fb;
        color: #161616;
      }

      main {
        width: min(640px, 92vw);
        text-align: center;
        padding: 2rem;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 5vw, 3rem);
      }

      p {
        margin: 0 0 1.5rem;
        font-size: 1.1rem;
        color: #4a4a4a;
      }

      a {
        display: inline-block;
        padding: 0.8rem 1.2rem;
        border-radius: 0.6rem;
        text-decoration: none;
        font-weight: 700;
        background: #1f6feb;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Impulsa tu proyecto hoy</h1>
      <p>Una landing simple y clara para presentar tu propuesta de valor.</p>
      <a href="#contacto">Comenzar ahora</a>
    </main>
  </body>
</html>
