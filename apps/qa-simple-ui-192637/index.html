<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Landing Simple</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f7ff;
        color: #1a1a1a;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      .card {
        width: 100%;
        max-width: 560px;
        text-align: center;
        background: #ffffff;
        border: 1px solid #dde3ff;
        border-radius: 14px;
        padding: 2.5rem 2rem;
        box-shadow: 0 10px 30px rgba(33, 57, 128, 0.08);
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 2rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: #4a4f63;
        line-height: 1.5;
      }
      .cta {
        display: inline-block;
        text-decoration: none;
        background: #3b5bdb;
        color: #fff;
        padding: 0.8rem 1.4rem;
        border-radius: 10px;
        font-weight: 700;
      }
      .cta:hover {
        background: #314bb7;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>Impulsa tu proyecto hoy</h1>
        <p>Una landing simple para presentar tu idea, captar atención y convertir visitas en acciones.</p>
        <a class="cta" href="#contacto">Comenzar ahora</a>
      </section>
    </main>
  </body>
</html>
